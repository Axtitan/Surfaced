version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # First match wins, so the React group comes before dev-tooling.
      # react and react-dom must always move together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-tooling:
        dependency-type: development
    ignore:
      # Held back until eslint-config-next and typescript-eslint support them (checked 12 November 2026).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the Node version the site runs on (24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
